name: Generate / Maintain Lock File

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Verify Dependencies 📦
        run: npm install

      - name: Audit Packages 🔍
        run: npm audit fix --audit-level=high || true
